<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" id="theme-color" content="#f6f5f3" />
  <script>
    // Same saved theme as the Nationals app, applied before first paint.
    (function () {
      var t = null;
      try { t = JSON.parse(localStorage.getItem("usafl.theme")); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
      document.getElementById("theme-color").content = t === "dark" ? "#0e0d0c" : "#f6f5f3";
    })();
  </script>
  <script>
    // The Nationals 2026 app used to live at this address. Send its old links and bookmarks on to /nationals/.
    (function () {
      var page = location.hash.replace(/^#\/?/, "").split("/")[0];
      var old = ["schedule", "umpires", "u", "fields", "jeff", "guide", "quiz", "welcome", "admin"].indexOf(page) > -1;
      if (old || /[?&](install|now|inapp)=/.test(location.search)) location.replace("nationals/" + location.search + location.hash);
    })();
    // That app's offline worker also lived here. Its replacement (sw.js) switches itself off; nudge it to update.
    if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) {
      rs.forEach(function (r) { if (new URL(r.scope).pathname === "/") r.update().catch(function () {}); });
    }).catch(function () {});
  </script>
  <title>USAFL Umpires</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="preload" href="fonts/barlow-condensed-800.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="hub.css" />
</head>
<body>
  <aside id="side"></aside>
  <main id="main"><div class="wrap" id="view"></div></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="api.js"></script>
  <script src="hub.js"></script>
</body>
</html>
